[workspace]
name = "tractor-magnet"
version = "0.1.0"
description = "Reproducible calculations for two-dimensional tractor magnets"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=2.0,<3"
scipy = ">=1.14,<2"
sympy = ">=1.13,<2"
matplotlib = ">=3.9,<4"
ffmpeg = ">=7,<9"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
MPLCONFIGDIR = "$PIXI_PROJECT_ROOT/.pixi/matplotlib"

[feature.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=6,<8"
ruff = ">=0.9,<1"

[pypi-dependencies]
shiny = ">=1.8,<2"
shinylive = "==0.8.12"

[feature.dev.tasks]
test = "pytest"
lint = "ruff check src tests scripts"
format = "ruff format src tests scripts"
figure-5 = "python scripts/reproduce_figure_5.py"
figure-4 = "python scripts/reproduce_figure_4.py"
supplementary-landscapes = "python scripts/reproduce_supplementary_landscapes.py"
production-line-animation = "python scripts/animate_production_line_landscape.py"
app = "shiny run --host 127.0.0.1 --port 8000 src/app.py"
export-site = "shinylive export src site"

[environments]
default = { features = ["dev"], solve-group = "default" }
