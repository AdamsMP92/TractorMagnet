<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Tractor-magnet geometry convention</title>
  <desc id="desc">Plan view showing the attractor at minus a on the x-axis, two repulsors at plus and minus b on the y-axis, and the movable follower at its equilibrium position on the positive x-axis.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7b8798"/>
    </marker>
    <marker id="dimension-start" markerWidth="8" markerHeight="8" refX="1.5" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#172033"/>
    </marker>
    <marker id="dimension-end" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#172033"/>
    </marker>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#172033" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="918" height="428" rx="22" fill="#f8fafc" stroke="#e1e7ef"/>

  <line x1="78" y1="216" x2="850" y2="216" stroke="#aab4c2" stroke-width="2" stroke-dasharray="8 9" marker-end="url(#axis-arrow)"/>
  <line x1="460" y1="390" x2="460" y2="36" stroke="#aab4c2" stroke-width="2" stroke-dasharray="8 9" marker-end="url(#axis-arrow)"/>
  <text x="858" y="222" fill="#667085" font-family="DM Sans, sans-serif" font-size="20">x</text>
  <text x="470" y="35" fill="#667085" font-family="DM Sans, sans-serif" font-size="20">y</text>

  <circle cx="232" cy="216" r="58" fill="#6558ad" stroke="#ffffff" stroke-width="5" filter="url(#shadow)"/>
  <text x="232" y="211" text-anchor="middle" fill="#ffffff" font-family="DM Sans, sans-serif" font-size="20" font-weight="700">Attractor</text>
  <text x="232" y="237" text-anchor="middle" fill="#e9e7fb" font-family="DM Sans, sans-serif" font-size="16">(-a, 0)</text>

  <circle cx="460" cy="74" r="44" fill="#178c98" stroke="#ffffff" stroke-width="5" filter="url(#shadow)"/>
  <text x="460" y="70" text-anchor="middle" fill="#ffffff" font-family="DM Sans, sans-serif" font-size="16" font-weight="700">Repulsor</text>
  <text x="460" y="91" text-anchor="middle" fill="#d8f2f1" font-family="DM Sans, sans-serif" font-size="14">(0, +b)</text>

  <circle cx="460" cy="358" r="44" fill="#178c98" stroke="#ffffff" stroke-width="5" filter="url(#shadow)"/>
  <text x="460" y="354" text-anchor="middle" fill="#ffffff" font-family="DM Sans, sans-serif" font-size="16" font-weight="700">Repulsor</text>
  <text x="460" y="375" text-anchor="middle" fill="#d8f2f1" font-family="DM Sans, sans-serif" font-size="14">(0, -b)</text>

  <circle cx="690" cy="216" r="61" fill="#df842f" stroke="#ffffff" stroke-width="5" filter="url(#shadow)"/>
  <text x="690" y="205" text-anchor="middle" fill="#ffffff" font-family="DM Sans, sans-serif" font-size="19" font-weight="700">Follower</text>
  <text x="690" y="228" text-anchor="middle" fill="#fff0df" font-family="DM Sans, sans-serif" font-size="15">movable</text>
  <text x="690" y="249" text-anchor="middle" fill="#fff0df" font-family="DM Sans, sans-serif" font-size="14">(x_eq, 0)</text>

  <circle cx="460" cy="216" r="5" fill="#172033"/>
  <text x="472" y="239" fill="#344054" font-family="DM Sans, sans-serif" font-size="15">origin</text>

  <line x1="232" y1="281" x2="232" y2="306" stroke="#667085" stroke-width="1.5"/>
  <line x1="460" y1="264" x2="460" y2="306" stroke="#667085" stroke-width="1.5"/>
  <line x1="238" y1="296" x2="454" y2="296" stroke="#172033" stroke-width="2.2" marker-start="url(#dimension-start)" marker-end="url(#dimension-end)"/>
  <rect x="332" y="278" width="28" height="31" rx="8" fill="#ffffff"/>
  <text x="346" y="301" text-anchor="middle" fill="#172033" font-family="Newsreader, Georgia, serif" font-size="25" font-style="italic">a</text>

  <line x1="509" y1="74" x2="552" y2="74" stroke="#667085" stroke-width="1.5"/>
  <line x1="526" y1="216" x2="552" y2="216" stroke="#667085" stroke-width="1.5"/>
  <line x1="541" y1="80" x2="541" y2="210" stroke="#172033" stroke-width="2.2" marker-start="url(#dimension-start)" marker-end="url(#dimension-end)"/>
  <rect x="526" y="130" width="30" height="31" rx="8" fill="#ffffff"/>
  <text x="541" y="153" text-anchor="middle" fill="#172033" font-family="Newsreader, Georgia, serif" font-size="25" font-style="italic">b</text>
</svg>
